<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1280 460" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">Norn memory model</title>
  <desc id="desc">The producer reserves with a release CAS, publishes with a release store, and the consumer consumes with an acquire load. A synchronizes-with edge orders the handoff; the linearization point is the CAS reservation.</desc>
  <defs>
    <marker id="n-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5bb5"/>
    </marker>
    <marker id="n-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a90"/>
    </marker>
    <style>
      .canvas { fill: #f7f8fc; }
      .title { fill: #20242e; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node rect { fill: #ffffff; stroke: #20242e; stroke-width: 2; rx: 12; }
      .node .label { fill: #20242e; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .detail { fill: #69727a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .number { fill: #4f5bb5; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node .role { fill: #6b7a90; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #4f5bb5; stroke-width: 2.5; marker-end: url(#n-arrow); }
      .sync { fill: none; stroke: #6b7a90; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#n-arrow-slate); }
      .mark rect { fill: #eceef6; stroke: #4f5bb5; stroke-width: 1.5; rx: 10; }
      .mark .label { fill: #3a3f8f; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .note { fill: #4f5b63; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="460"/>
  <text class="title" x="48" y="56">NORN  /  MEMORY MODEL</text>
  <text class="subtitle" x="48" y="84">release / acquire orders the handoff across the ring</text>

  <g class="node" transform="translate(60 170)">
    <rect width="220" height="96"/>
    <text class="number" x="18" y="28">01</text>
    <text class="role" x="120" y="28">producer</text>
    <text class="label" x="120" y="62">reserve</text>
    <text class="detail" x="120" y="86">CAS, release</text>
  </g>
  <g class="node" transform="translate(340 170)">
    <rect width="220" height="96"/>
    <text class="number" x="18" y="28">02</text>
    <text class="role" x="120" y="28">producer</text>
    <text class="label" x="120" y="62">publish</text>
    <text class="detail" x="120" y="86">release store</text>
  </g>
  <g class="node" transform="translate(620 170)">
    <rect width="220" height="96"/>
    <text class="number" x="18" y="28">03</text>
    <text class="role" x="120" y="28">consumer</text>
    <text class="label" x="120" y="62">consume</text>
    <text class="detail" x="120" y="86">acquire load</text>
  </g>
  <g class="node" transform="translate(900 170)">
    <rect width="220" height="96"/>
    <text class="number" x="18" y="28">04</text>
    <text class="role" x="120" y="28">consumer</text>
    <text class="label" x="120" y="62">reuse slot</text>
    <text class="detail" x="120" y="86">release slot</text>
  </g>

  <path class="flow" d="M280 218 H340"/>
  <path class="flow" d="M560 218 H620"/>
  <path class="flow" d="M840 218 H900"/>
  <path class="sync" d="M450 266 C 540 340, 660 340, 730 266"/>

  <g class="mark" transform="translate(880 78)">
    <rect width="340" height="48"/>
    <text class="label" x="170" y="30">linearization point: CAS reservation</text>
  </g>

  <text class="note" x="48" y="420">The synchronizes-with edge (dashed) propagates the published value to the acquiring consumer; a stale slot read is impossible after it.</text>
</svg>
