<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Norn historical queue benchmark comparison</title>
  <desc id="desc">Historical throughput evidence from commit 5d73d0eb on an Apple M1. The figure is generated from committed JSON evidence.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .title { fill: #172026; font: 700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .subtitle { fill: #59636a; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .label { fill: #29353b; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .value { fill: #1f6f68; font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .tick { fill: #69737a; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-anchor: middle; }
    .grid { stroke: #d9dfdc; stroke-width: 1; }
    .bar { fill: #2d8a7d; }
  </style>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="20" y="38">Historical queue throughput</text>
  <text class="subtitle" x="20" y="65">Apple M1 · Apple Clang 21.0.0 · Release · commit 5d73d0eb · setup included</text>
  <line class="grid" x1="330.000" y1="90" x2="330.000" y2="544"/>
  <text class="tick" x="330.000" y="574">0M</text>
  <line class="grid" x1="527.500" y1="90" x2="527.500" y2="544"/>
  <text class="tick" x="527.500" y="574">8M</text>
  <line class="grid" x1="725.000" y1="90" x2="725.000" y2="544"/>
  <text class="tick" x="725.000" y="574">16M</text>
  <line class="grid" x1="922.500" y1="90" x2="922.500" y2="544"/>
  <text class="tick" x="922.500" y="574">24M</text>
  <line class="grid" x1="1120.000" y1="90" x2="1120.000" y2="544"/>
  <text class="tick" x="1120.000" y="574">32M</text>
  <text class="label" x="20" y="134">Bounded mutex queue / single-thread push/pop</text>
  <rect class="bar" x="330" y="110" width="362.413" height="38" rx="6"/>
  <text class="value" x="704.413" y="134">14.68M items/s</text>
  <text class="label" x="20" y="198">SPSC ring / unpadded</text>
  <rect class="bar" x="330" y="174" width="336.738" height="38" rx="6"/>
  <text class="value" x="678.737" y="198">13.64M items/s</text>
  <text class="label" x="20" y="262">SPSC ring / padded</text>
  <rect class="bar" x="330" y="238" width="414.997" height="38" rx="6"/>
  <text class="value" x="756.997" y="262">16.81M items/s</text>
  <text class="label" x="20" y="326">MPMC ring / 1x1</text>
  <rect class="bar" x="330" y="302" width="754.450" height="38" rx="6"/>
  <text class="value" x="1096.450" y="326">30.56M items/s</text>
  <text class="label" x="20" y="390">MPMC ring / 2x2</text>
  <rect class="bar" x="330" y="366" width="161.703" height="38" rx="6"/>
  <text class="value" x="503.703" y="390">6.55M items/s</text>
  <text class="label" x="20" y="454">MPMC ring / 4x4</text>
  <rect class="bar" x="330" y="430" width="146.891" height="38" rx="6"/>
  <text class="value" x="488.891" y="454">5.95M items/s</text>
  <text class="label" x="20" y="518">Hazard-pointer queue / MPSC, 1x1</text>
  <rect class="bar" x="330" y="494" width="126.894" height="38" rx="6"/>
  <text class="value" x="468.894" y="518">5.14M items/s</text>
  <text class="subtitle" x="330" y="602">items per second</text>
</svg>
