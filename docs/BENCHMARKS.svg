<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1280 600" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">Norn throughput evidence</title>
  <desc id="desc">Measured throughput (ops/s, items per second) for each queue structure on an Apple M1 with Apple Clang 21.0.0, Release build, batch size 100,000. Single-owner rings are fastest; MPMC peaks at 1x1 then falls with contention; the unbounded hazard-pointer queue is the slowest but removes the capacity ceiling.</desc>
  <defs>
    <marker id="n-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5bb5"/>
    </marker>
    <style>
      .canvas { fill: #f7f8fc; }
      .title { fill: #20242e; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .axis { stroke: #6b7a90; stroke-width: 2; }
      .grid { stroke: #c9cde0; stroke-width: 1; }
      .bar { fill: #4f5bb5; }
      .bar-alt { fill: #6b7a90; }
      .bar-value { fill: #20242e; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .bar-name { fill: #20242e; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .bar-conf { fill: #69727a; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .axis-label { fill: #6b7a90; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tick { fill: #6b7a90; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: end; }
      .note { fill: #4f5b63; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="600"/>
  <text class="title" x="48" y="56">NORN  /  THROUGHPUT EVIDENCE</text>
  <text class="subtitle" x="48" y="84">measured ops/s, Apple M1, Apple Clang 21.0.0, Release, batch 100,000</text>

  <line class="axis" x1="160" y1="120" x2="160" y2="470"/>
  <line class="axis" x1="160" y1="470" x2="1180" y2="470"/>
  <line class="grid" x1="160" y1="355" x2="1180" y2="355"/>
  <line class="grid" x1="160" y1="241" x2="1180" y2="241"/>
  <line class="grid" x1="160" y1="126" x2="1180" y2="126"/>
  <text class="tick" x="150" y="124">30M</text>
  <text class="tick" x="150" y="245">20M</text>
  <text class="tick" x="150" y="359">10M</text>
  <text class="tick" x="150" y="474">0</text>
  <text class="axis-label" x="48" y="110">ops/s (higher is better)</text>

  <rect class="bar" x="170" y="302" width="110" height="168"/>
  <rect class="bar" x="320" y="314" width="110" height="156"/>
  <rect class="bar-alt" x="470" y="277" width="110" height="193"/>
  <rect class="bar-alt" x="620" y="120" width="110" height="350"/>
  <rect class="bar" x="770" y="395" width="110" height="75"/>
  <rect class="bar-alt" x="920" y="402" width="110" height="68"/>
  <rect class="bar" x="1070" y="411" width="110" height="59"/>

  <text class="bar-value" x="225" y="294">14.68M</text>
  <text class="bar-value" x="375" y="306">13.64M</text>
  <text class="bar-value" x="525" y="269">16.81M</text>
  <text class="bar-value" x="675" y="112">30.56M</text>
  <text class="bar-value" x="825" y="387">6.55M</text>
  <text class="bar-value" x="975" y="394">5.95M</text>
  <text class="bar-value" x="1125" y="403">5.14M</text>

  <text class="bar-name" x="225" y="492">mutex</text>
  <text class="bar-conf" x="225" y="510">single-thread</text>
  <text class="bar-name" x="375" y="492">SPSC</text>
  <text class="bar-conf" x="375" y="510">unpadded</text>
  <text class="bar-name" x="525" y="492">SPSC</text>
  <text class="bar-conf" x="525" y="510">padded</text>
  <text class="bar-name" x="675" y="492">MPMC</text>
  <text class="bar-conf" x="675" y="510">1x1</text>
  <text class="bar-name" x="825" y="492">MPMC</text>
  <text class="bar-conf" x="825" y="510">2x2</text>
  <text class="bar-name" x="975" y="492">MPMC</text>
  <text class="bar-conf" x="975" y="510">4x4</text>
  <text class="bar-name" x="1125" y="492">hazard</text>
  <text class="bar-conf" x="1125" y="510">MPSC 1x1</text>

  <text class="note" x="48" y="560">Indigo bars are single-owner or unbounded structures; slate bars are the MPMC family. Source: docs/BENCHMARKING.md. ns/item agree with these ops/s values.</text>
</svg>
