<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1280 620" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">Norn difficulty ladder</title>
  <desc id="desc">Each structure adds one new hard problem: mutex baselines set reference behavior, SPSC rings introduce false sharing, the MPMC ring adds CAS reservation, and the hazard-pointer queue adds heap reclamation.</desc>
  <defs>
    <marker id="n-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5bb5"/>
    </marker>
    <style>
      .canvas { fill: #f7f8fc; }
      .title { fill: #20242e; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #69727a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node rect { fill: #ffffff; stroke: #20242e; stroke-width: 2; rx: 12; }
      .node .label { fill: #20242e; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .detail { fill: #69727a; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node .number { fill: #4f5bb5; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #4f5bb5; stroke-width: 2.5; marker-end: url(#n-arrow); }
      .hazard rect { fill: #eceef6; stroke: #c9cde0; stroke-width: 1.5; rx: 10; }
      .hazard .hl { fill: #6b7a90; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .hazard .dt { fill: #69727a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="620"/>
  <text class="title" x="48" y="56">NORN  /  DIFFICULTY LADDER</text>
  <text class="subtitle" x="48" y="84">each structure adds exactly one new hard problem</text>

  <g class="node" transform="translate(40 150)">
    <rect width="270" height="300"/>
    <text class="number" x="20" y="30">01</text>
    <text class="label" x="145" y="62">mutex baselines</text>
    <text class="detail" x="145" y="98">reference behavior</text>
    <text class="detail" x="145" y="122">close + drain</text>
    <text class="detail" x="145" y="146">simple to reason about</text>
    <g class="hazard" transform="translate(20 200)">
      <rect width="230" height="76"/>
      <text class="hl" x="115" y="28">new hazard</text>
      <text class="dt" x="115" y="52">none - the baseline</text>
    </g>
  </g>
  <g class="node" transform="translate(350 150)">
    <rect width="270" height="300"/>
    <text class="number" x="20" y="30">02</text>
    <text class="label" x="145" y="62">SPSC rings</text>
    <text class="detail" x="145" y="98">owned indices</text>
    <text class="detail" x="145" y="122">single producer</text>
    <text class="detail" x="145" y="146">single consumer</text>
    <g class="hazard" transform="translate(20 200)">
      <rect width="230" height="76"/>
      <text class="hl" x="115" y="28">new hazard</text>
      <text class="dt" x="115" y="52">false sharing</text>
    </g>
  </g>
  <g class="node" transform="translate(660 150)">
    <rect width="270" height="300"/>
    <text class="number" x="20" y="30">03</text>
    <text class="label" x="145" y="62">MPMC ring</text>
    <text class="detail" x="145" y="98">sequence numbers</text>
    <text class="detail" x="145" y="122">many producers</text>
    <text class="detail" x="145" y="146">many consumers</text>
    <g class="hazard" transform="translate(20 200)">
      <rect width="230" height="76"/>
      <text class="hl" x="115" y="28">new hazard</text>
      <text class="dt" x="115" y="52">CAS reservation</text>
    </g>
  </g>
  <g class="node" transform="translate(970 150)">
    <rect width="270" height="300"/>
    <text class="number" x="20" y="30">04</text>
    <text class="label" x="145" y="62">hazard-pointer queue</text>
    <text class="detail" x="145" y="98">heap nodes</text>
    <text class="detail" x="145" y="122">unbounded</text>
    <text class="detail" x="145" y="146">protect / retire / reclaim</text>
    <g class="hazard" transform="translate(20 200)">
      <rect width="230" height="76"/>
      <text class="hl" x="115" y="28">new hazard</text>
      <text class="dt" x="115" y="52">node reclamation</text>
    </g>
  </g>

  <path class="flow" d="M310 300 H350"/>
  <path class="flow" d="M620 300 H660"/>
  <path class="flow" d="M930 300 H970"/>
</svg>
